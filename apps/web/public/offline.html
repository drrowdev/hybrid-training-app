<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · S×C</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #0f1310;
        color: #e6ebe2;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        gap: 20px;
      }
      .mark {
        font-weight: 800;
        font-size: 56px;
        letter-spacing: 2px;
        line-height: 1;
      }
      .mark .x {
        color: #8fb39b;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 32ch;
        font-size: 14px;
        line-height: 1.6;
        color: #afb8a8;
      }
      button {
        margin-top: 4px;
        appearance: none;
        border: 1px solid #384230;
        background: #141813;
        color: #e6ebe2;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 22px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active {
        background: #1f251d;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">S<span class="x">×</span>C</div>
    <h1>You're offline</h1>
    <p>
      S×C can't reach the network right now. Logged sets are saved on this
      device and will sync once you're back online.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
