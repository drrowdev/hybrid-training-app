name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests (domain + engine)
        run: pnpm -r --filter './packages/**' test

      - name: Build web
        run: pnpm --filter @hta/web build
        env:
          # Public env vars need values during build to satisfy Next.js
          # static-analysis; the placeholders below are non-functional
          # (sb_publishable_test) and only exist so the build doesn't fail
          # on missing-var checks. Real values come from Vercel env.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_for_ci_build_only

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    # Skip cleanly on forks / PRs that don't have the secrets — the
    # specs themselves also self-skip when env isn't wired, but
    # gating the job here avoids wasted browser-install minutes.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check E2E secrets
        id: e2e_secrets
        run: |
          if [ -n "${{ secrets.E2E_SUPABASE_URL }}" ] \
             && [ -n "${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" ] \
             && [ -n "${{ secrets.E2E_SUPABASE_ANON_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E secrets not configured — Playwright tests will self-skip."
          fi

      - name: Install Playwright browsers
        run: pnpm --filter @hta/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @hta/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'sb_publishable_test_for_ci_build_only' }}

      - name: Start web (background)
        run: |
          pnpm --filter @hta/web start &
          echo $! > .web.pid
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'sb_publishable_test_for_ci_build_only' }}

      - name: Wait for app to be ready
        run: npx --yes wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Run Playwright
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: pnpm --filter @hta/web exec playwright test

      - name: Stop web
        if: always()
        run: |
          if [ -f .web.pid ]; then kill "$(cat .web.pid)" || true; fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
