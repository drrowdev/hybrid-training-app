name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate_production:
        description: Apply all pending Drizzle migrations to production
        required: false
        default: false
        type: boolean
      allow_undeployed:
        description: >-
          Skip the deploy-order guard. Only for a migration the CURRENTLY LIVE
          build already tolerates, or a repo with no Vercel integration.
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-guard:
    name: author identity guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history to inspect every commit a PR introduces.
          fetch-depth: 0

      - name: Reject non-allowlisted commit identities
        # The repo's GitHub contributors graph must only ever resolve to
        # drrowdev (or the Copilot bot / GitHub web-flow committer). Stray
        # identities (seed scripts, local agents committing as
        # mlagus@…/agent@local/…) have repeatedly polluted the graph and
        # required a history rewrite to undo. This guard blocks them at the
        # PR before they can reach main. Allowlist by EMAIL (author + committer
        # of every commit the PR/push introduces).
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ALLOWED="280348738+drrowdev@users.noreply.github.com 223556219+Copilot@users.noreply.github.com noreply@github.com"
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="origin/${BASE_REF}..HEAD"
          else
            # push: inspect the most recent commit on the ref (squash-merge
            # lands a single commit). Fall back to HEAD if there is no parent.
            RANGE="HEAD^..HEAD"
            git rev-parse HEAD^ >/dev/null 2>&1 || RANGE="HEAD"
          fi
          echo "Inspecting commit range: $RANGE"
          BAD=0
          while IFS='|' read -r sha ae ce; do
            [ -z "$sha" ] && continue
            ok_a=0; ok_c=0
            for e in $ALLOWED; do
              [ "$ae" = "$e" ] && ok_a=1
              [ "$ce" = "$e" ] && ok_c=1
            done
            if [ "$ok_a" -ne 1 ] || [ "$ok_c" -ne 1 ]; then
              echo "::error::Commit $sha has a non-allowlisted identity (author=<$ae> committer=<$ce>). Commits must be authored by drrowdev/Copilot."
              BAD=1
            fi
          done < <(git log --no-merges --pretty=format:'%H|%ae|%ce' $RANGE)
          if [ "$BAD" -ne 0 ]; then
            {
              echo "## ❌ Disallowed commit identity"
              echo ""
              echo "Every commit must have author AND committer email in the allowlist:"
              echo "- \`280348738+drrowdev@users.noreply.github.com\` (drrowdev)"
              echo "- \`223556219+Copilot@users.noreply.github.com\` (Copilot)"
              echo "- \`noreply@github.com\` (GitHub web-flow)"
              echo ""
              echo "Fix with: \`git rebase --exec 'git commit --amend --reset-author --no-edit' origin/${BASE_REF}\` after setting \`git config user.email\` to the drrowdev no-reply address."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All commit identities are allowlisted."

  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests (domain + engine)
        run: pnpm -r --filter './packages/**' test

      - name: Unit tests (web)
        run: pnpm --filter @hta/web test

      - name: Build web
        run: pnpm --filter @hta/web build
        env:
          # Public env vars need values during build to satisfy Next.js
          # static-analysis; the placeholders below are non-functional
          # (sb_publishable_test) and only exist so the build doesn't fail
          # on missing-var checks. Real values come from Vercel env.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_for_ci_build_only

      - name: Migration drift guard (offline)
        # No shared dev-DB secret in CI, so the script runs in offline
        # mode and validates only that every _journal.json entry has a
        # matching .sql file on disk and hashes cleanly. The full
        # journal-vs-__drizzle_migrations check fires from the
        # pre-push hook on developer machines where DATABASE_URL is set.
        run: pnpm --filter @hta/db db:check:ci

      - name: Knowledge-doc drift guard (offline)
        # The private workspace mirror ($HTA_WORKSPACE_DOCS) is not on the
        # CI runner, so this runs the in-repo checks only: every Accepted
        # ADR that declares it adds a CP-2 row must be referenced in
        # docs/knowledge/hybrid-training-design-constraints.md. The full
        # repo<->workspace coverage parity fires from the pre-push hook on
        # developer machines where HTA_WORKSPACE_DOCS is set.
        run: pnpm docs:check-drift

      - name: Flag new migrations in PR description
        # When a PR adds files under packages/db/drizzle/*.sql, surface a
        # loud reminder in the job summary so the merger remembers to
        # dispatch the guarded production migration job. The repo doesn't
        # auto-deploy migrations.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          NEW_SQL=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD -- 'packages/db/drizzle/*.sql' || true)
          if [ -n "$NEW_SQL" ]; then
            {
              echo "## ⚠️ This PR adds a new migration"
              echo ""
              echo "The repo does not auto-apply migrations. After merging, WAIT for"
              echo "the Vercel production deploy to go green, then dispatch:"
              echo ""
              echo "    gh workflow run ci.yml --ref main -f migrate_production=true"
              echo ""
              echo "That job refuses to run until the commit has deployed"
              echo "successfully, so a destructive migration can't land while"
              echo "production is still serving code that reads the dropped object."
              echo ""
              echo "**New files:**"
              echo "$NEW_SQL" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::New migration files in this PR. Dispatch the production migration workflow after the deploy is green."
          fi

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    # Skip cleanly on forks / PRs that don't have the secrets — the
    # specs themselves also self-skip when env isn't wired, but
    # gating the job here avoids wasted browser-install minutes.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check E2E secrets
        id: e2e_secrets
        run: |
          if { [ -n "${{ secrets.E2E_SUPABASE_URL }}" ] \
               && [ -n "${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" ] \
               && [ -n "${{ secrets.E2E_SUPABASE_ANON_KEY }}" ]; } \
             || { [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] \
                  && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] \
                  && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E secrets not configured — Playwright tests will self-skip."
          fi
      - name: Install Playwright browsers
        run: pnpm --filter @hta/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @hta/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_test_for_ci_build_only' }}

      - name: Start web (background)
        run: |
          pnpm --filter @hta/web start &
          echo $! > .web.pid
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_test_for_ci_build_only' }}
          # Serve the dev-only fixture routes under /dev. This job runs a
          # PRODUCTION bundle, so a NODE_ENV check alone would 404 them and
          # take the credential-free specs (logger ergonomics) with it.
          # Deploys never set this, so the routes stay 404 in prod.
          ENABLE_E2E_FIXTURES: "1"

      - name: Wait for app to be ready
        run: npx --yes wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Run Playwright
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # The fixture reads E2E_* first then falls back to the standard
          # Next.js Supabase names. Passing both lets a dedicated test
          # project override the dev project when configured.
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @hta/web exec playwright test

      # A self-skipped Playwright run reports the same green check as a fully
      # executing one, which is how 83 of 102 tests stayed dormant unnoticed.
      # Surface the real execution ratio on every run.
      - name: Report e2e execution coverage
        if: always()
        run: |
          REPORT=apps/web/playwright-report/results.json
          if [ ! -f "$REPORT" ]; then
            echo "::warning::No Playwright JSON report produced — cannot report coverage."
            exit 0
          fi
          node -e '
            const r = require("./apps/web/playwright-report/results.json");
            const counts = { expected: 0, skipped: 0, unexpected: 0, flaky: 0 };
            const walk = (suite) => {
              for (const spec of suite.specs ?? [])
                for (const test of spec.tests ?? [])
                  counts[test.status] = (counts[test.status] ?? 0) + 1;
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of r.suites ?? []) walk(suite);
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            const ran = total - counts.skipped;
            const pct = total ? Math.round((ran / total) * 100) : 0;
            const lines = [];
            if (counts.skipped > 0) {
              lines.push("## ⚠️ e2e ran " + ran + " of " + total + " tests (" + pct + "%)");
              lines.push("");
              lines.push(counts.skipped + " tests self-skipped because the E2E Supabase secrets are not configured.");
              lines.push("");
              lines.push("Set `E2E_SUPABASE_URL`, `E2E_SUPABASE_SERVICE_ROLE_KEY` and");
              lines.push("`E2E_SUPABASE_ANON_KEY` (pointing at a DEDICATED test project, never prod)");
              lines.push("to turn these back on. See `apps/web/e2e/README.md`.");
            } else {
              lines.push("## ✅ e2e ran all " + total + " tests");
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (counts.skipped > 0) {
              console.log("::warning::e2e executed only " + ran + " of " + total + " tests — " + counts.skipped + " self-skipped (E2E secrets not configured).");
            }
          '

      - name: Stop web
        if: always()
        run: |
          if [ -f .web.pid ]; then kill "$(cat .web.pid)" || true; fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  rpc-smoke:
    name: rpc smoke tests
    # Post-merge only. Hits the e2e Supabase project — same secrets the
    # Playwright e2e job uses. PRs don't run it (shared project + we
    # want PR feedback to stay fast). Catches SQL bugs the mocked unit
    # tests miss: signature mismatch, ambiguous column refs, missing
    # GRANT, etc. See apps/web/e2e-rpc/README.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run RPC smoke tests
        env:
          SMOKE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SMOKE_SUPABASE_URL}" ] || [ -z "${SMOKE_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            {
              echo "## ⚠️ rpc-smoke skipped"
              echo ""
              echo "Set the \`E2E_SUPABASE_URL\` + \`E2E_SUPABASE_SERVICE_ROLE_KEY\`"
              echo "repository secrets to enable this job. Same secrets the"
              echo "Playwright e2e job uses."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm --filter @hta/web test:rpc-smoke

  prod-migrate:
    name: apply prod migrations
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.migrate_production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    environment: Production
    permissions:
      contents: read
      # Read the Vercel integration's GitHub Deployment records so the
      # deploy-order guard below can prove the app is already live.
      deployments: read
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Require a successful production app deploy for this commit
        # DEPLOY ORDER GUARD.
        #
        # This repo's model is app-first, database-second: Vercel deploys on
        # merge to main, migrations are applied later by dispatching this job.
        # Every migration on main must therefore be backwards-compatible with
        # the build that is ALREADY serving traffic (AGENTS.md), and a
        # destructive one (DROP COLUMN / DROP TABLE) is only safe once the
        # release that stopped reading the dropped object is live.
        #
        # Nothing used to enforce that. `needs: ci` only proves the code is
        # green, not that Vercel finished shipping it — so dispatching while a
        # deploy was still building, or after one had failed and rolled back,
        # would drop columns out from under the running app. Migration 0131
        # (drop body_comp_phase) is exactly that shape: the old build SELECTs
        # the columns by name and 500s the moment they disappear.
        #
        # So: refuse to migrate unless VERCEL has recorded a SUCCESSFUL
        # Production deployment for this exact commit. No new secret —
        # `vercel[bot]` writes standard GitHub Deployment records, readable
        # with the workflow token.
        #
        # TWO SUBTLETIES, both learned the hard way on the first real run:
        #
        #  1. This job itself declares `environment: Production`, so GitHub
        #     creates its OWN Production deployment record for it. Querying
        #     "newest Production deployment for this SHA" therefore found THIS
        #     JOB, mid-run, in state `in_progress`, and failed — which then
        #     marked its own record `failure`. The guard could never pass.
        #     Hence: only consider records created by `vercel[bot]`.
        #
        #  2. A commit can have several Vercel Production deployments (a
        #     redeploy, a promote). A later duplicate failing does NOT unship
        #     the earlier successful one — a failed build never replaces live
        #     code. So the question is "has this commit EVER deployed
        #     successfully", not "did the most recent attempt succeed".
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ALLOW_UNDEPLOYED: ${{ inputs.allow_undeployed }}
        run: |
          set -euo pipefail

          if [ "${ALLOW_UNDEPLOYED}" = "true" ]; then
            {
              echo "## ⚠️ Deploy-order guard BYPASSED"
              echo ""
              echo "\`allow_undeployed\` was set, so migrations are being applied"
              echo "without proving the app for \`${SHA}\` is live. Only correct for"
              echo "a migration you know the running build tolerates."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Deploy-order guard bypassed via allow_undeployed."
            exit 0
          fi

          echo "Looking for a Vercel Production deployment of ${SHA}…"
          # `vercel[bot]` only — see subtlety (1) above.
          DEPLOY_IDS=$(gh api --paginate \
            "repos/${REPO}/deployments?sha=${SHA}&environment=Production&per_page=100" \
            --jq '.[] | select(.creator.login == "vercel[bot]") | .id')

          if [ -z "${DEPLOY_IDS}" ]; then
            {
              echo "## ❌ No Vercel production deployment for this commit"
              echo ""
              echo "Commit \`${SHA}\` has no \`Production\` deployment from"
              echo "\`vercel[bot]\`, so the app running in production is NOT this"
              echo "code. Applying migrations now can break the live build."
              echo ""
              echo "**Wait for the Vercel deploy of \`main\` to finish, then re-dispatch.**"
              echo ""
              echo "If this repo genuinely has no Vercel integration, re-dispatch with"
              echo "\`allow_undeployed=true\` — but only if the running build tolerates"
              echo "the pending migrations."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No Vercel Production deployment found for ${SHA}."
            exit 1
          fi

          # Any successful attempt is enough — see subtlety (2) above.
          SUCCESS_ID=""
          SEEN=""
          for id in ${DEPLOY_IDS}; do
            state=$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=100" \
              --jq '[.[].state] | if any(. == "success") then "success" else (.[0] // "unknown") end')
            echo "  deployment ${id}: ${state}"
            SEEN="${SEEN}- \`${id}\` → \`${state}\`"$'\n'
            if [ "${state}" = "success" ] && [ -z "${SUCCESS_ID}" ]; then
              SUCCESS_ID="${id}"
            fi
          done

          if [ -z "${SUCCESS_ID}" ]; then
            {
              echo "## ❌ No successful production deploy for this commit"
              echo ""
              echo "Vercel has Production deployment(s) for \`${SHA}\`, but none"
              echo "reached \`success\`:"
              echo ""
              echo "${SEEN}"
              echo "If a deploy is still building, wait and re-dispatch. If it FAILED,"
              echo "production is still serving older code — fix the deploy first,"
              echo "because migrating now would break the live build."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No Vercel Production deployment of ${SHA} reached 'success'."
            exit 1
          fi

          {
            echo "## ✅ Deploy-order guard passed"
            echo ""
            echo "Production is serving \`${SHA}\` (Vercel deployment"
            echo "\`${SUCCESS_ID}\`), so pending migrations are safe to apply"
            echo "against the live build."
            echo ""
            echo "${SEEN}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::SUPABASE_PROD_DB_URL is not configured."
            exit 1
          fi
          pnpm --filter @hta/db db:migrate

      - name: Verify production migration state
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: pnpm --filter @hta/db db:check

  prod-drift:
    name: prod migration drift guard
    # Runs only after merge to main. Connects to the production
    # Supabase database (read-only) and asserts that every migration in
    # _journal.json has been applied to __drizzle_migrations. Surfaces
    # the gap loudly if someone merges a migration without running
    # the guarded `prod-migrate` workflow-dispatch job. Read-only — never writes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ci
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check prod DB matches journal
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            {
              echo "## ⚠️ prod-drift skipped"
              echo ""
              echo "Set the \`SUPABASE_PROD_DB_URL\` repository secret to enable this job."
              echo "Use a connection string for a read-only role if possible."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if pnpm --filter @hta/db db:check; then
            echo "::notice::Prod DB is in sync with _journal.json."
          else
            {
              echo "## ❌ Prod database is behind"
              echo ""
              echo "Dispatch the guarded production migration job:"
              echo ""
              echo "    gh workflow run ci.yml --ref main -f migrate_production=true"
              echo ""
              echo "Then re-run this job (Re-run jobs button)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
